version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: seat-reservation-postgres
    restart: always
    environment:
      POSTGRES_DB: seat_reservation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seat_reservation"]
      interval: 3s
      timeout: 5s
      retries: 10
    networks:
      - seat-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seat-reservation-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/seat_reservation
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      PORT: 8080
      HIKARI_MAX_POOL_SIZE: 50
      MAX_SEATS_PER_USER: 4
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - seat-net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: seat-reservation-prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app
    networks:
      - seat-net

volumes:
  postgres_data:
  prometheus_data:

networks:
  seat-net:
    driver: bridge
